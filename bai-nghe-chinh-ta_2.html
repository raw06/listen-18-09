<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nghe và chép chính tả</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDE6; --card:#FCFDFB; --ink:#18261F; --muted:#5B6B62; --line:#C9D3C9;
  --accent:#1F5E4B; --accent-soft:#D9E7E0; --gold:#8A6300; --gold-soft:#F3E6C6;
  --bad:#A22C1F; --bad-soft:#F6DED9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:26px 20px 72px}
h1{font-family:var(--serif);font-weight:500;font-size:29px;margin:0}
h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 10px}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:14px;margin:0}
hr.rule{border:0;border-top:1px solid var(--line);margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card + .card{margin-top:16px}
.hint{font-size:13px;color:var(--muted)}
textarea,select{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{line-height:1.6;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--sans);font-size:15px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.btn{background:var(--accent);color:#fff;padding:10px 18px;font-weight:500}
.btn:hover{background:#174a3b}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:transparent;color:var(--muted);padding:8px 10px}
.btn.quiet:hover{color:var(--ink);text-decoration:underline}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden{display:none !important}
.hide-ref .ref{display:none}

#script{list-style:none;margin:0;padding:0}
.ln{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:9px 10px;border-radius:8px;border-left:3px solid transparent}
.ln + .ln{margin-top:2px}
.spk{font-size:12px;color:var(--muted);padding-top:6px}
.ln .text{font-family:var(--serif);font-size:19px;line-height:1.6}
.ln.future .spk{opacity:.35}
.ln.done{opacity:.75}
.ln.now{background:var(--accent-soft);border-left-color:var(--accent)}
.ln.ask{background:var(--gold-soft);border-left-color:var(--gold)}
.ln.ask .spk{color:var(--gold)}
.blank{font-family:var(--serif);font-size:19px;color:var(--muted);letter-spacing:1px}
.w{border-radius:3px;padding:0 2px}
.w.ok{color:#14503F;background:var(--accent-soft)}
.w.sub,.w.ins{color:var(--bad);background:var(--bad-soft)}
.w.ins{text-decoration:line-through}
.w.miss{color:var(--gold);background:var(--gold-soft)}
.mini{font-size:12px;color:var(--muted);margin:2px 0 0}

.bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.big{background:var(--accent);color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.big:hover{background:#174a3b}
.big svg{width:22px;height:22px;fill:currentColor}
.meter{flex:1 1 180px;min-width:140px}
.meter .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter .fill{height:100%;width:0;background:var(--accent)}
.meter p{margin:6px 0 0}
.score{font-family:var(--serif);font-size:42px;line-height:1}
.score small{font-family:var(--sans);font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.wrap{padding:18px 13px 52px}h1{font-size:24px}.ln{grid-template-columns:70px 1fr;gap:8px}.ln .text,.blank{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Nghe và chép chính tả</h1>
    <p class="sub">Chép đúng từng từ bạn nghe được. Nghe lại bao nhiêu lần cũng được.</p>
  </div>
  <hr class="rule">

  <section id="practice">
    <div class="bar">
      <button class="big" id="mainBtn" aria-label="Phát">
        <svg id="mainIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="meter">
        <div class="track"><div class="fill" id="fill"></div></div>
        <p class="hint" id="status">Bấm phát để bắt đầu</p>
      </div>
      <div class="row">
        <button class="btn ghost" id="againBtn" disabled>Nghe lại câu</button>
        <select id="rateSel" aria-label="Tốc độ" style="width:auto">
          <option value="0.6">0,6×</option>
          <option value="0.8">0,8×</option>
          <option value="1" selected>1×</option>
        </select>
      </div>
    </div>
    <div class="card"><ol id="script"></ol></div>
  </section>

  <section id="summary" class="hidden">
    <div class="card">
      <div class="score" id="finalScore">0<small> / 100 điểm</small></div>
      <p class="hint" id="finalNote" style="margin-top:8px"></p>
    </div>
    <div class="card">
      <h2>Chi tiết từng câu</h2>
      <table id="detailTable" class="hide-ref">
        <thead><tr><th style="width:36px">#</th><th>Bạn chép</th><th class="ref">Lời thoại</th><th class="num" style="width:66px">Từ đúng</th></tr></thead>
        <tbody id="detailBody"></tbody>
      </table>
      <div class="row" style="margin-top:18px">
        <button class="btn" id="retryBtn">Làm lại từ đầu</button>
        <button class="btn ghost" id="revealBtn">Hiện lời thoại</button>
      </div>
    </div>
  </section>

    [16.3, 18.3, 2, "So my father calls, bring your tail home."],
    [18.3, 23.3, 2, "So I come home, we land late. Be here tomorrow at 5 a.m. Like, what you heard?"],
    [23.3, 25.3, 2, "I said, yes, sir."],
    [25.3, 33.3, 2, "So I go home, wake up 5 a.m., we get in the car, we driving, and if my father don't speak, you don't speak."],
    [33.3, 35.3, 2, "You don't speak until you're spoken to. Ever."],
    [35.3, 39.3, 2, "So I said something, and he's like, what? So now he's upset."],
    [39.3, 44.3, 2, "Well, you couldn't handle the pressure. Why not? Couldn't handle the pressure. So now he's very upset."],
    [44.3, 48.3, 2, "We ride and we under this bridge. It's a homeless family. And he said."],
    [48.3, 53.3, 2, "And he turns the light off. They're sleeping in a little tent. And we're just sitting, waiting."],
    [53.3, 56.3, 2, "5, 5:30, 6, 6:30."],
    [56.3, 62.3, 2, "The guy comes out, and my father says, that's pressure. And then the wife comes out, and then the two babies come out."],
    [62.3, 65.3, 2, "Pressure is when you don't know when your next meal is coming from."],
    [65.3, 70.3, 2, "Tired of you rich, spoiled athletes not performing to your level and saying you can't handle the pressure."],
    [70.3, 74.3, 2, "You don't know what pressure is. You still get paid after a bad game."]
  ].map(function (r) { return { start: r[0], end: r[1], spk: r[2], text: r[3] }; });

  var answers = {}, results = {}, target = -1, curIdx = -1, phase = "idle", stopAt = null;

  /* ---- chấm theo số từ đúng ---- */
  function norm(w) {
    return w.toLowerCase()
      .replace(/[\u2018\u2019\u02BC]/g, "'")
      .replace(/[^\p{L}\p{N}' ]/gu, " ")
      .replace(/\s+/g, " ").trim();
  }
  function words(t) { var s = norm(t); return s.length ? s.split(/\s+/) : []; }
  function align(ref, hyp) {
    var n = ref.length, m = hyp.length, i, j, d = [], b = [];
    for (i = 0; i <= n; i++) { d.push(new Array(m + 1).fill(0)); b.push(new Array(m + 1).fill("")); }
    for (i = 1; i <= n; i++) { d[i][0] = i; b[i][0] = "del"; }
    for (j = 1; j <= m; j++) { d[0][j] = j; b[0][j] = "ins"; }
    for (i = 1; i <= n; i++) for (j = 1; j <= m; j++) {
      var same = ref[i - 1] === hyp[j - 1];
      var best = d[i - 1][j - 1] + (same ? 0 : 1), op = same ? "ok" : "sub";
      if (d[i - 1][j] + 1 < best) { best = d[i - 1][j] + 1; op = "del"; }
      if (d[i][j - 1] + 1 < best) { best = d[i][j - 1] + 1; op = "ins"; }
      d[i][j] = best; b[i][j] = op;
    }
    var ops = []; i = n; j = m;
    while (i > 0 || j > 0) {
      var op = i === 0 ? "ins" : j === 0 ? "del" : b[i][j];
      if (op === "ok" || op === "sub") { ops.push({ op: op, ref: ref[i - 1], hyp: hyp[j - 1] }); i--; j--; }
      else if (op === "del") { ops.push({ op: "del", ref: ref[i - 1] }); i--; }
      else { ops.push({ op: "ins", hyp: hyp[j - 1] }); j--; }
    }
    return ops.reverse();
  }
  function grade(ref, hyp) {
    var r = words(ref), h = words(hyp), ops = align(r, h);
    var hit = ops.filter(function (o) { return o.op === "ok"; }).length;
    return { ops: ops, hit: hit, total: r.length, score: r.length ? Math.round(100 * hit / r.length) : 0 };
  }
  function span(cls, text) {
    var s = document.createElement("span");
    s.className = "w " + cls; s.textContent = text; return s;
  }
  function diffNodes(ops) {
    var box = document.createElement("div");
    var yours = document.createElement("div"); yours.className = "text";
    var right = document.createElement("div"); right.className = "text";
    ops.forEach(function (o) {
      if (o.op === "ok") { yours.appendChild(span("ok", o.hyp)); yours.append(" "); right.appendChild(span("ok", o.ref)); right.append(" "); }
      else if (o.op === "sub") { yours.appendChild(span("sub", o.hyp)); yours.append(" "); right.appendChild(span("miss", o.ref)); right.append(" "); }
      else if (o.op === "ins") { yours.appendChild(span("ins", o.hyp)); yours.append(" "); }
      else { right.appendChild(span("miss", o.ref)); right.append(" "); }
    });
    var l1 = document.createElement("p"); l1.className = "mini"; l1.textContent = "Bạn chép";
    var l2 = document.createElement("p"); l2.className = "mini"; l2.textContent = "Lời thoại";
    box.append(l1, yours, l2, right);
    return box;
  }

  /* ---- dựng danh sách câu ---- */
  function buildScript() {
    var ol = $("script"); ol.innerHTML = "";
    LINES.forEach(function (l, i) {
      var li = document.createElement("li");
      li.className = "ln future"; li.id = "ln" + i;
      var sp = document.createElement("div"); sp.className = "spk";
      sp.textContent = "Speaker " + l.spk;
      var body = document.createElement("div"); body.className = "body";
      li.append(sp, body);
      ol.appendChild(li);
    });
  }
  function fillLine(i) {
    var body = $("ln" + i).querySelector(".body");
    body.innerHTML = "";
    if (answers[i] !== undefined) {
      var d2 = document.createElement("div"); d2.className = "text";
      var typed = (answers[i] || "").trim();
      d2.textContent = typed || "(bỏ trống)";
      if (!typed) d2.style.color = "var(--muted)";
      body.appendChild(d2);
    } else {
      var b = document.createElement("div"); b.className = "blank";
      b.textContent = "▁".repeat(Math.min(30, Math.max(6, words(LINES[i].text).length * 2)));
      body.appendChild(b);
    }
  }
  function paint(active) {
    LINES.forEach(function (l, i) {
      var li = $("ln" + i);
      var seen = i <= active || answers[i] !== undefined;
      li.className = "ln" + (seen ? "" : " future")
        + (i === active && phase === "answer" ? " ask" : "")
        + (i === active && phase === "play" ? " now" : "")
        + (i < active ? " done" : "");
      if (seen) fillLine(i); else li.querySelector(".body").innerHTML = "";
    });
  }

  /* ---- phát ---- */
  function setIcon(playing) {
    $("mainIcon").innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  }
  function playRange(from, to) {
    phase = "play"; stopAt = to;
    audio.currentTime = from;
    audio.playbackRate = parseFloat($("rateSel").value);
    audio.play().catch(function () { $("status").textContent = "Bấm nút phát lần nữa để trình duyệt cho chạy tiếng."; });
    setIcon(true);
  }
  audio.addEventListener("timeupdate", function () {
    if (phase === "idle" || phase === "done") return;
    $("fill").style.width = (100 * audio.currentTime / (audio.duration || 1)) + "%";
    if (phase !== "play") return;
    var i = LINES.findIndex(function (l) { return audio.currentTime >= l.start && audio.currentTime < l.end; });
    if (i >= 0 && i !== curIdx) { curIdx = i; paint(i); }
    if (stopAt !== null && audio.currentTime >= stopAt) { audio.pause(); setIcon(false); enterAnswer(); }
  });
  audio.addEventListener("ended", function () {
    if (phase === "play") { setIcon(false); if (target >= 0) enterAnswer(); else finish(); }
  });

  /* ---- trả lời ---- */
  function enterAnswer() {
    if (target < 0) { finish(); return; }
    phase = "answer"; curIdx = target; paint(target);
    var li = $("ln" + target), body = li.querySelector(".body");
    body.innerHTML = "";
    var ta = document.createElement("textarea");
    ta.rows = 2; ta.spellcheck = false; ta.autocapitalize = "off";
    ta.setAttribute("aria-label", "Chép câu bạn vừa nghe");
    var row = document.createElement("div"); row.className = "row"; row.style.marginTop = "8px";
    var last = target + 1 >= LINES.length;
    var ok = document.createElement("button"); ok.className = "btn";
    ok.textContent = last ? "Nộp bài" : "Câu tiếp theo";
    var skip = document.createElement("button"); skip.className = "btn quiet"; skip.textContent = "Bỏ qua";
    row.append(ok, skip);
    body.append(ta, row);
    ok.addEventListener("click", function () { submit(ta.value); });
    skip.addEventListener("click", function () { submit(""); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(ta.value); }
    });
    ta.focus();
    $("status").textContent = "Câu " + (target + 1) + " / " + LINES.length + " — chép lại rồi bấm Enter";
    $("againBtn").disabled = false;
    li.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function submit(answer) {
    var i = target;
    answers[i] = answer;
    phase = "play"; paint(i);
    if (i + 1 >= LINES.length) { target = -1; finish(); return; }
    target = i + 1;
    $("againBtn").disabled = true;
    $("status").textContent = "Đang nghe câu " + (target + 1);
    playRange(LINES[i].end, LINES[target].end);
  }

  /* ---- nút ---- */
  $("mainBtn").addEventListener("click", function () {
    if (phase === "idle") {
      target = 0; curIdx = -1;
      $("status").textContent = "Đang nghe câu 1";
      playRange(0, LINES[0].end);
      return;
    }
    if (phase === "answer" || phase === "done") return;
    if (audio.paused) { audio.play(); setIcon(true); } else { audio.pause(); setIcon(false); }
  });
  $("againBtn").addEventListener("click", function () {
    if (phase !== "answer" || target < 0) return;
    var l = LINES[target], keep = target;
    audio.currentTime = l.start;
    audio.playbackRate = parseFloat($("rateSel").value);
    audio.play();
    setIcon(true);
    var watch = function () {
      $("fill").style.width = (100 * audio.currentTime / (audio.duration || 1)) + "%";
      if (audio.currentTime >= l.end) {
        audio.pause(); setIcon(false);
        audio.removeEventListener("timeupdate", watch);
        if (phase === "answer" && target === keep) {
          var ta = $("ln" + keep).querySelector("textarea");
          if (ta) ta.focus();
        }
      }
    };
    audio.addEventListener("timeupdate", watch);
  });
  $("rateSel").addEventListener("change", function () { audio.playbackRate = parseFloat(this.value); });

  /* ---- kết thúc ---- */
  function finish() {
    audio.pause(); setIcon(false); phase = "done";
    var hit = 0, tot = 0;
    LINES.forEach(function (l, i) {
      results[i] = grade(l.text, answers[i] || "");
      hit += results[i].hit;
      tot += results[i].total;
    });
    $("finalScore").innerHTML = (tot ? Math.round(100 * hit / tot) : 0) + '<small> / 100 điểm</small>';
    var weak = LINES.filter(function (l, i) { return results[i].score < 80; }).length;
    $("finalNote").textContent = "Nghe đúng " + hit + " / " + tot + " từ."
      + (weak ? " Còn " + weak + " câu dưới 80 điểm." : " Chép đúng gần như trọn vẹn.");
    var tb = $("detailBody"); tb.innerHTML = "";
    LINES.forEach(function (l, i) {
      var r = results[i];
      var tr = document.createElement("tr");
      var a = document.createElement("td"); a.className = "num"; a.textContent = i + 1;
      var b = document.createElement("td");
      if ((answers[i] || "").trim()) {
        r.ops.forEach(function (o) {
          if (o.op === "ok") { b.appendChild(span("ok", o.hyp)); b.append(" "); }
          else if (o.op === "sub" || o.op === "ins") { b.appendChild(span("sub", o.hyp)); b.append(" "); }
        });
      } else { b.textContent = "—"; }
      var c = document.createElement("td"); c.className = "ref"; c.textContent = l.text;
      var d = document.createElement("td"); d.className = "num"; d.textContent = r.hit + "/" + r.total;
      tr.append(a, b, c, d); tb.appendChild(tr);
    });
    $("practice").classList.add("hidden");
    $("summary").classList.remove("hidden");
    window.scrollTo(0, 0);
  }
  $("revealBtn").addEventListener("click", function () {
    var t = $("detailTable"), hidden = t.classList.toggle("hide-ref");
    this.textContent = hidden ? "Hiện lời thoại" : "Ẩn lời thoại";
  });
  $("retryBtn").addEventListener("click", init);

  function init() {
    answers = {}; results = {}; target = -1; curIdx = -1; phase = "idle"; stopAt = null;
    audio.pause(); audio.currentTime = 0;
    buildScript(); paint(-1); setIcon(false);
    $("fill").style.width = "0%";
    $("status").textContent = "Bấm phát để bắt đầu";
    $("againBtn").disabled = true;
    $("summary").classList.add("hidden");
    $("detailTable").classList.add("hide-ref");
    $("revealBtn").textContent = "Hiện lời thoại";
    $("practice").classList.remove("hidden");
    window.scrollTo(0, 0);
  }
  init();
})();
</script>
</body>
</html>
